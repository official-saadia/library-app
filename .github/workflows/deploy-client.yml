name: Deploy Client
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn package
      - uses: actions/upload-artifact@v4
        with:
          name: library-app-jar
          path: target/*.jar

  deploy:
    needs: build
    runs-on: [self-hosted, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: library-app-jar
      - run: |
          pkill -f library || true
          setsid nohup java -jar *.jar > app.log 2>&1 < /dev/null &
        env:
          RUNNER_TRACKING_ID: ""
      - run: ./smoke-test.sh http://localhost:8080